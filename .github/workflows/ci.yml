# Check the committed data and the site on every push. Nothing is published: the repository is private.
# The data pipeline is NOT run here: it needs API quota, a manual curation step and a large model.
# Refresh data locally (see README), commit web/public/data, then push.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    name: Validate data (schema + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt numpy
      - run: python -m pytest -q pipeline/tests
      - run: python -m pipeline.run --steps validate,fields --offline

  build:
    name: Typecheck and build
    needs: validate-data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
